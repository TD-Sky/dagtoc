[package]
name = "dagtoc"
version = "5.1.0"
edition = "2024"
categories = ["command-line-utilities"]
keywords = ["pdf"]
description = "A CLI tool for operating pdf contents"
repository = "https://github.com/TD-Sky/dagtoc"
documentation = "https://github.com/TD-Sky/dagtoc"
readme = "README.md"
license = "MIT"
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "LICENSE*", "README.md"]

[dependencies]
usage-rs = { version = "7.1", features = ["completions"] }
eros = "0.8"
kdl = "6.7"
pdf_oxide = "0.3.78"

[profile.release]
lto = true

[lints.clippy]
new_without_default = "allow"
module_inception = "allow"
